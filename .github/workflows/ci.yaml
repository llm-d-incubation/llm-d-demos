# SPDX-License-Identifier: Apache-2.0
name: Validate Demos Catalog

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  validate:
    name: Schema, Catalog Sync, Hygiene & Demo Verify
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install validator dependencies
        run: python3 -m pip install --no-cache-dir pyyaml

      - name: Run catalog & demo validation
        run: python3 scripts/validate.py

      - name: Verify README and catalog.json are up to date
        run: python3 scripts/render_catalog.py --check
