# Service the Hermes agents use to reach the fleet driver's LLM proxy
# (-llm-listen :8091). The agents' MODEL_BASE_URL points here:
#   http://llm-proxy.agent-demo.svc.cluster.local:8091/llm/v1
apiVersion: v1
kind: Service
metadata:
  name: llm-proxy
  namespace: agent-demo
spec:
  selector:
    app: fleet-driver
  ports:
  - name: llm
    port: 8091
    targetPort: 8091
